# Environment the Fig 5b integration (scVI/scANVI, COSIE) ran in: `spatial_integration`, 2026-04.
# Check with: python 01_verify_env.py
name: saha-fig5-integration
channels:
  - conda-forge
dependencies:
  - python=3.11
  - scanpy=1.11.5
  - anndata=0.12.10
  - squidpy=1.8.1
  - pip
  - pip:
      - scvi-tools==1.4.2
      - torch==2.5.1
      - torch-geometric==2.7.0
      - thefuzz
      - tacos==0.0.2   # COSIE fallback; or install COSIE: pip install git+https://github.com/weilicode/cosie.git
